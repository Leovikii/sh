name: rclone checks
on:
  push:
    paths: ['rclone/**', '.github/workflows/rclone.yml']
  pull_request:
    paths: ['rclone/**', '.github/workflows/rclone.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./rclone/Test-RcloneDriveManager.ps1
      - name: PowerShell 7
        shell: pwsh
        run: pwsh.exe -NoProfile -File ./rclone/Test-RcloneDriveManager.ps1
